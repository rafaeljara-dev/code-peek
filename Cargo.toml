[workspace]
resolver = "2"
members = [
    "crates/peek-core",
    "crates/peek-tree",
    "crates/peek-syntax",
    "crates/peek-ui",
    "crates/peek-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Rafael Jara", "CodePeek Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rafaeljara-dev/code-peek"

[workspace.dependencies]
# Text & Buffer
ropey = "1.6"

# Directory traversal & Fuzzy search
ignore = "0.4"
nucleo = "0.5"

# Syntax Highlighting
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }

# UI & Graphics
slint = { version = "1.9", default-features = false, features = ["compat-1-2", "renderer-femtovg", "backend-winit"] }
slint-build = "1.9"

# Concurrency & Filesystem
tokio = { version = "1.43", features = ["full"] }
notify = "8.0"
memmap2 = "0.9"
crossbeam-channel = "0.5"
rayon = "1.10"

# CLI & Utilities
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
dirs = "6.0"

# Performance Release Profile: maximum speed, minimum binary size
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
