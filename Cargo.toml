[workspace]
resolver = "2"
members = [
    "crates/peek-core",
    "crates/peek-tree",
    "crates/peek-syntax",
    "crates/peek-ui",
    "crates/peek-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["CodePeek Contributors"]
license = "MIT"
repository = "https://github.com/rafaeljara-dev/code-peek"

[workspace.dependencies]
# Text & Buffer
ropey = "1.6"

# Directory traversal & Fuzzy search
ignore = "0.4"
nucleo = "0.5"

# Syntax Highlighting & Documents
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
pulldown-cmark = "0.13"
roxmltree = "0.21"
calamine = "0.38"
csv = "1.4"
zip = { version = "9.5", default-features = false, features = ["deflate-flate2"] }
hayro = "0.9"

# UI & Graphics
slint = { version = "1.9", default-features = false, features = ["compat-1-2", "renderer-femtovg", "backend-winit"] }
slint-build = "1.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico", "tiff", "qoi", "tga"] }
resvg = { version = "0.47", default-features = false, features = ["raster-images"] }
tiny-skia = "0.12"
usvg = { version = "0.49", default-features = false }

# Concurrency & Filesystem
rayon = "1.10"

# Testing
tempfile = "3"

# CLI & Utilities
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
dirs = "6.0"

# Performance Release Profile: maximum speed, minimum binary size
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
